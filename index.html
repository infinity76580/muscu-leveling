<style>
/* Layout: one narrow column of glowing "System" windows over a dark void, bottom tab bar;
   a dungeon (gym session) runs full screen with a sticky header and a rest-timer bar. Single dark world on purpose. */
:root{
  --void:#03060d;
  --panel-top:rgba(13,32,70,.9);
  --panel-bot:rgba(4,12,28,.94);
  --line:rgba(86,170,255,.55);
  --blue:#3d9bff;
  --glow:#9ad8ff;
  --text:#dfeaff;
  --muted:#8b9cc0;

  --gold:#f5c95a;
  --red:#ff4058;
  --red-soft:#ff8597;
  --ok:#5ef0b8;
  --violet:#a881ff;
  --orange:#ffa04a;
  --ink:#03101f;
  --r-E:#a3aec2; --r-D:#5ef0b8; --r-C:#3d9bff; --r-B:#a881ff; --r-A:#ffa04a; --r-S:#f5c95a;
  --font-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--void);color:var(--text);font:400 16px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(110% 55% at 50% -8%,rgba(36,110,255,.28),transparent 62%),
  radial-gradient(70% 40% at 50% 108%,rgba(120,70,255,.14),transparent 60%),
  linear-gradient(rgba(90,160,255,.045) 1px,transparent 1px) 0 0/34px 34px,
  linear-gradient(90deg,rgba(90,160,255,.045) 1px,transparent 1px) 0 0/34px 34px}
body.penalty::before{background:
  radial-gradient(110% 55% at 50% -8%,rgba(255,40,70,.26),transparent 62%),
  radial-gradient(70% 40% at 50% 108%,rgba(255,40,70,.12),transparent 60%),
  linear-gradient(rgba(255,90,110,.05) 1px,transparent 1px) 0 0/34px 34px,
  linear-gradient(90deg,rgba(255,90,110,.05) 1px,transparent 1px) 0 0/34px 34px}
p{margin:0}
h1,h2,h3{text-wrap:balance}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(108px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:14px}
.sys-line{font-family:var(--font-display);color:var(--glow);font-size:15px;letter-spacing:.02em}
.lead{color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;flex-direction:column;gap:3px;line-height:1.1}
.brand-mark{font:700 15px var(--font-display);letter-spacing:.32em;color:var(--glow);text-shadow:0 0 14px rgba(90,180,255,.7)}
.save{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--font-display);color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.save i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.save.local i{background:var(--orange);box-shadow:0 0 8px var(--orange)}
.icon-btn{width:46px;height:46px;display:grid;place-items:center;background:transparent;border:1px solid var(--line);color:var(--glow);border-radius:2px;cursor:pointer}
.icon-btn svg{width:22px;height:22px}

/* System window */
.win{position:relative;background:linear-gradient(180deg,var(--panel-top),var(--panel-bot));border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(6,20,48,.9),inset 0 0 36px rgba(50,140,255,.10),0 0 26px rgba(30,120,255,.16);padding:18px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.win::before,.win::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--glow);pointer-events:none;filter:drop-shadow(0 0 4px rgba(120,200,255,.8))}

.win::after{bottom:-2px;right:-2px;border-left:0;border-top:0}
.win-title{margin:0;font:600 13px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.22em;color:var(--glow);display:flex;align-items:center;gap:12px;text-shadow:0 0 10px rgba(110,190,255,.6);text-align:center}

.win.red{--line:rgba(255,70,95,.7);background:linear-gradient(180deg,rgba(70,8,20,.92),rgba(25,3,10,.95));box-shadow:inset 0 0 36px rgba(255,50,80,.14),0 0 30px rgba(255,40,70,.25)}
.win.red::before,.win.red::after{border-color:var(--red-soft);filter:drop-shadow(0 0 4px rgba(255,90,110,.8))}
.win.red .win-title,.win.red .sys-line{color:var(--red-soft);text-shadow:0 0 10px rgba(255,80,100,.6)}
.win.red .win-title::before,.win.red .win-title::after{background:linear-gradient(90deg,transparent,rgba(255,120,140,.7))}

/* buttons & inputs */
.btn{font:600 14px/1.15 var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--text);background:rgba(40,120,255,.14);border:1px solid var(--line);padding:13px 16px;min-height:46px;border-radius:2px;cursor:pointer;transition:background .15s,box-shadow .15s}
.btn:hover{background:rgba(60,140,255,.26)}
.btn.primary{background:linear-gradient(180deg,rgba(70,160,255,.55),rgba(30,90,220,.45));border-color:var(--glow);box-shadow:0 0 18px rgba(60,150,255,.45),inset 0 0 12px rgba(170,220,255,.25);color:#fff}
.btn.gold{background:linear-gradient(180deg,rgba(245,201,90,.35),rgba(170,120,20,.3));border-color:var(--gold);color:#fff3cf}
.btn.danger{background:rgba(255,64,88,.22);border-color:var(--red);color:#ffd2d8}
.btn.ghost{background:transparent}
.btn.sm{padding:9px 12px;min-height:40px;font-size:12px}
.btn.big{min-height:58px;font-size:16px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.btn{flex:1 1 160px}
input,select,textarea{font:500 16px var(--font-body);color:var(--text);background:rgba(4,14,34,.85);border:1px solid rgba(90,170,255,.4);border-radius:2px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:72px;resize:vertical}
input::placeholder,textarea::placeholder{color:rgba(139,156,192,.65)}
label,.lbl{font:600 12px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field small{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.link{background:none;border:0;color:var(--muted);font:500 14px var(--font-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 0;min-height:34px;align-self:flex-start;text-align:left}

/* status */
.st-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.st-id{min-width:0}
.st-name{font:700 30px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 18px rgba(90,170,255,.55)}
.st-title{color:var(--muted);font-size:14px;margin-top:6px}
.st-title b{color:var(--text);font-weight:600}
.st-rank{display:flex;align-items:center;gap:14px;margin-top:12px;font:600 14px var(--font-display);letter-spacing:.06em}
.st-level{display:flex;flex-direction:column;align-items:flex-end;line-height:1}
.st-level span{font:600 11px var(--font-display);letter-spacing:.24em;color:var(--muted);text-transform:uppercase}
.st-level b{font:700 64px/.9 var(--font-display);color:#fff;text-shadow:0 0 22px rgba(100,180,255,.85);font-variant-numeric:tabular-nums}
.rank-badge{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;color:var(--rc);border:2px solid var(--rc);transform:rotate(45deg);box-shadow:0 0 14px color-mix(in srgb,var(--rc) 55%,transparent);margin-left:4px}
.rank-badge>span{transform:rotate(-45deg);font:700 16px var(--font-display)}
.xpbar{height:10px;background:rgba(40,80,150,.35);border:1px solid rgba(90,170,255,.35);position:relative;overflow:hidden}
.xpbar.thin{height:6px}
.xpbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2a7bff,#8fdcff);box-shadow:0 0 12px rgba(120,200,255,.9);transition:width .6s ease}
.xp-line{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap;font:500 13px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.money{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-size:15px;flex-wrap:wrap}
.money b{color:var(--gold);font-size:20px;font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(245,201,90,.5)}
.money.big b{font-size:40px;line-height:1}
.coin{display:inline-block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2b8,#f5c95a 45%,#9c6a12);box-shadow:0 0 8px rgba(245,201,90,.6);flex:none}

.stats{display:grid;border-top:1px solid var(--faint)}

.stat-k{grid-column:1;grid-row:1/span 2;font:700 13px var(--font-display);color:var(--glow);letter-spacing:.1em}
.stat-l{grid-column:2;grid-row:1;font-weight:600;line-height:1.2}
.stat small{grid-column:2;grid-row:2;color:var(--muted);font-size:12px;line-height:1.3}
.stat-v{grid-column:3;grid-row:1/span 2;font:700 22px var(--font-display);font-variant-numeric:tabular-nums}

/* portal */
.portal{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.gate{position:relative;width:84px;height:84px}
.gate-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--rc),transparent 28%,var(--rc) 50%,transparent 78%,var(--rc));-webkit-mask:radial-gradient(circle,transparent 47%,#000 49%,#000 67%,transparent 71%);mask:radial-gradient(circle,transparent 47%,#000 49%,#000 67%,transparent 71%);animation:spin 7s linear infinite;filter:drop-shadow(0 0 8px var(--rc))}
.gate-core{position:absolute;inset:16%;border-radius:50%;background:radial-gradient(circle,#000 25%,color-mix(in srgb,var(--rc) 45%,#000) 70%,transparent 72%);box-shadow:0 0 26px color-mix(in srgb,var(--rc) 50%,transparent);animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.92);opacity:.8}}
.eyebrow{font:600 11px var(--font-display);letter-spacing:.2em;text-transform:uppercase;color:var(--rc,var(--glow))}
.portal h3{margin:2px 0 4px;font:700 21px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.portal p{font-size:15px}
.portal-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
.portal-actions .btn{flex:1 1 180px}
.nw{white-space:nowrap}
.gap-warn{font-size:14px;color:#ffd9b0;border-left:2px solid var(--orange);padding:6px 10px;background:rgba(255,160,74,.09);margin-top:6px}
.portal-mini{display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed color-mix(in srgb,var(--rc) 60%,transparent);background:rgba(20,50,110,.16)}
.portal-mini .row .btn{flex:1 1 140px}
.rest-day{padding:12px;border:1px dashed rgba(120,190,255,.35);background:rgba(20,50,110,.18)}
.resume{border-color:var(--gold)}

/* chips */
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 9px;background:rgba(20,50,110,.3);border:1px solid rgba(90,170,255,.3);color:var(--text);font-family:var(--font-display);text-align:left;cursor:pointer;border-radius:2px;min-height:44px;min-width:0}
.chip b{font-size:16px;line-height:1.1}
.chip span{font-size:12px;color:var(--muted);white-space:nowrap}
.chip i{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.st-done{border-color:var(--ok);background:rgba(60,220,160,.12)}
.chip.st-done i{color:var(--ok)}
.chip.st-partial{border-color:var(--orange)}
.chip.st-partial i,.chip.st-late i{color:var(--orange)}

.chip.st-missed{border-color:rgba(255,64,88,.55);background:rgba(255,40,70,.08)}
.chip.st-missed i{color:var(--red-soft)}
.chip.st-today{border-color:var(--glow);box-shadow:0 0 14px rgba(120,200,255,.5)}
.chip.st-today i{color:var(--glow)}
.chip.st-future{opacity:.55}
.chip-bonus{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;border-style:dashed;background:rgba(20,50,110,.16)}
.chip-bonus span{white-space:normal;flex:1;min-width:0}
.chip-bonus i{max-width:none}
.chip-bonus.st-done,.chip-bonus.st-partial{border-style:solid}

.joker{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px dashed rgba(245,201,90,.5);background:rgba(245,201,90,.06)}
.wk.is-deload .wk-l b{color:var(--gold)}

/* daily quest */
.seg{display:inline-flex;border:1px solid var(--line);align-self:flex-start}
.seg button{background:transparent;border:0;color:var(--muted);font:600 12px var(--font-display);letter-spacing:.14em;text-transform:uppercase;padding:9px 14px;min-height:40px;cursor:pointer}
.seg button.on{background:rgba(60,140,255,.3);color:#fff}
.qlist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.q{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px;background:rgba(10,30,70,.45);border:1px solid rgba(90,170,255,.25);color:var(--text);font:600 16px var(--font-body);text-align:left;cursor:pointer;border-radius:2px;min-height:52px}
.q .box{width:22px;height:22px;border:2px solid var(--glow);display:grid;place-items:center}
.q.on .box{background:var(--glow);box-shadow:0 0 12px var(--glow)}
.q.on .box::after{content:"";width:6px;height:11px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.q-t{font:600 13px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.q.on .q-t{color:var(--ok)}
.weigh{display:flex;flex-direction:column;gap:6px}
.weigh-in{display:flex;align-items:center;gap:8px;max-width:180px}
.weigh-in span{color:var(--muted);font-family:var(--font-display)}
.warn{font-size:14px;color:var(--muted)}
.warn b{color:var(--text);font-family:var(--font-display);font-variant-numeric:tabular-nums}
.done-line{font:600 14px var(--font-display);color:var(--ok)}
.quest.is-done{border-color:rgba(94,240,184,.6)}
.rules{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
.rules li::marker{color:var(--glow)}
.rules .danger{color:var(--red-soft)}
.wk-head{display:flex;justify-content:space-between;gap:12px;font-family:var(--font-display)}

/* dungeon map */
.wk{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px 12px;padding:12px 0;border-top:1px solid var(--faint)}
.wk-l b{font:700 20px/1 var(--font-display)}
.wk-l span{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.wk-m{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}
.wk-phase{font:600 15px var(--font-display);letter-spacing:.04em}
.wk .chips{grid-column:1/-1}
.wk.cur{background:rgba(60,140,255,.08);margin-inline:-8px;padding-inline:8px;border:1px solid var(--line)}
.wk.past{opacity:.78}
.pv-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pv{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px}
.pv-n{font:700 15px var(--font-display);color:var(--glow)}
.pv .muted{font-size:14px}
.ok-line{font:600 14px var(--font-display);color:var(--ok)}
details.fold{border-top:1px solid var(--faint);padding-top:10px}
details.fold summary{cursor:pointer;font:600 14px var(--font-display);letter-spacing:.06em;list-style:none;display:flex;justify-content:space-between;gap:12px;min-height:34px;align-items:center}

details.fold summary::after{content:"+";color:var(--glow);font-size:18px}

details.fold>div{padding-top:8px;display:grid;gap:8px;font-size:15px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}

ol.steps b{color:#fff}

/* dungeon run */
.dg-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(3,8,18,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.dg-name{font:700 15px var(--font-display);text-transform:uppercase;letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg-clock{font:600 17px var(--font-display);font-variant-numeric:tabular-nums;color:var(--glow)}
.ex{position:relative;border:1px solid rgba(90,170,255,.35);background:linear-gradient(180deg,rgba(10,26,58,.88),rgba(4,11,26,.92));padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ex.boss{border-color:rgba(255,64,88,.55);box-shadow:0 0 22px rgba(255,64,88,.12)}
.ex.cleared{border-color:rgba(94,240,184,.6);box-shadow:0 0 18px rgba(94,240,184,.12)}
.ex-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.ex-n{font:700 22px/1 var(--font-display);color:var(--glow);font-variant-numeric:tabular-nums;padding-top:2px}
.ex.cleared .ex-n{color:var(--ok)}
.ex h3{margin:0;font:700 17px/1.25 var(--font-display);letter-spacing:.02em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{font:600 10px/1.3 var(--font-display);letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border:1px solid rgba(120,190,255,.35);color:var(--muted)}
.tag.boss{color:var(--red-soft);border-color:rgba(255,64,88,.6)}
.tag.test{color:var(--gold);border-color:var(--gold)}
.target{font:600 15px var(--font-display)}
.target b{font-size:19px;color:#fff}
.fail{color:var(--red-soft);font:600 13px var(--font-display);letter-spacing:.04em}
.cue{color:var(--muted);font-size:14px}
.hist{font-size:14px;font-variant-numeric:tabular-nums}
.hist span{font:600 11px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:6px}
.sugg{font-size:14px;padding:8px 10px;border-left:2px solid var(--glow);background:rgba(60,140,255,.1)}
.sugg b{font-family:var(--font-display);color:#fff}
.sugg.up{border-color:var(--ok);background:rgba(94,240,184,.08)}
.sugg.test{border-color:var(--gold);background:rgba(245,201,90,.08)}
.sets{display:grid;gap:8px}
.set-row{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 54px;gap:8px;align-items:center}
.set-row.head span{font:600 10px var(--font-display);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center}
.set-row .sn{font:700 15px var(--font-display);color:var(--muted);text-align:center}
.set-row input{text-align:center;font:600 19px var(--font-display);padding:8px 4px;font-variant-numeric:tabular-nums;min-height:50px}
.chk{height:50px;border:1px solid var(--line);background:transparent;color:var(--glow);display:grid;place-items:center;cursor:pointer;border-radius:2px}
.chk svg{width:22px;height:22px}
.set-row.done .chk{background:var(--ok);border-color:var(--ok);color:var(--ink);box-shadow:0 0 14px rgba(94,240,184,.55)}
.set-row.done input{border-color:rgba(94,240,184,.5);color:var(--ok)}
.restbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:rgba(3,9,22,.97);border-top:1px solid var(--glow);box-shadow:0 -10px 30px rgba(30,120,255,.25)}
.restbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.rb-fill{position:absolute;left:0;top:0;height:3px;width:0;background:var(--glow);box-shadow:0 0 10px var(--glow)}
.rb-t{font:700 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.rb-l{font:600 11px var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.restbar.done{border-top-color:var(--ok)}
.restbar.done .rb-t{color:var(--ok)}

/* results */
.res-title{margin:0;font:700 clamp(30px,9vw,44px)/1 var(--font-display);text-align:center;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 0 26px rgba(100,180,255,.9)}
.res-title.partial{color:var(--orange);text-shadow:0 0 24px rgba(255,160,74,.6)}
.res-title.fail{color:var(--red-soft);text-shadow:0 0 24px rgba(255,64,88,.6)}
.res-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.res-cell{border:1px solid var(--faint);padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:2px}
.res-cell b{font:700 22px var(--font-display);font-variant-numeric:tabular-nums}
.res-cell span{font:600 10px var(--font-display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.gain{display:flex;flex-wrap:wrap;gap:8px 18px;font:600 16px var(--font-display);justify-content:center}
.gain .x{color:var(--glow)}
.gain .g{color:var(--gold)}
.pr-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pr-list li{padding:8px 10px;border-left:2px solid var(--gold);background:rgba(245,201,90,.07);font-size:15px}
.pr-list b{font-family:var(--font-display)}
.chest{display:grid;place-items:center;gap:10px;padding:10px 0}
.chest-btn{width:132px;height:104px;position:relative;border:0;background:none;cursor:pointer;color:var(--tc,var(--glow))}
.chest-box{position:absolute;left:10px;right:10px;bottom:8px;height:56px;border:2px solid currentColor;background:linear-gradient(180deg,rgba(30,70,140,.6),rgba(6,16,36,.9));box-shadow:0 0 24px color-mix(in srgb,currentColor 50%,transparent)}
.chest-lid{position:absolute;left:6px;right:6px;top:14px;height:30px;border:2px solid currentColor;border-radius:14px 14px 2px 2px;background:linear-gradient(180deg,rgba(50,110,200,.6),rgba(10,26,60,.9));transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-origin:10% 100%}
.chest-lock{position:absolute;left:50%;top:38px;width:16px;height:20px;margin-left:-8px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.chest-btn:not(.open){animation:wobble 2.2s ease-in-out infinite}
.chest-btn.open .chest-lid{transform:rotate(-28deg) translateY(-8px)}
.chest-btn.open .chest-lock{opacity:0}
@keyframes wobble{0%,80%,100%{transform:none}85%{transform:rotate(-3deg)}90%{transform:rotate(3deg)}95%{transform:rotate(-2deg)}}
.loot{font:700 18px var(--font-display);text-align:center;color:var(--tc)}

/* shop */
.shop{list-style:none;margin:0;padding:0;display:grid}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--faint)}
.rw:last-child{border-bottom:0}
.rw-n{font-weight:600;grid-column:1;grid-row:1}
.rw-c{grid-column:1;grid-row:2;display:flex;align-items:center;gap:6px;font:700 15px var(--font-display);color:var(--gold);font-variant-numeric:tabular-nums}
.rw .btn{grid-column:2;grid-row:1/span 2}
.rw.claimed .rw-n{color:var(--muted)}
.lock{font:600 14px var(--font-display);color:var(--red-soft)}
.hist-list{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.hist-list li{display:flex;justify-content:space-between;gap:12px}
.hist-list span:last-child{color:var(--gold);font-family:var(--font-display);white-space:nowrap}

/* editor */
.ed-list{display:grid;gap:8px}
.ed{display:grid;grid-template-columns:44px minmax(0,1fr) 92px;gap:8px;align-items:start}
.ed-food{grid-column:2/-1;justify-self:start;background:none;border:1px dashed var(--faint);color:var(--muted);font:600 11px var(--font-display);letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;cursor:pointer;margin-top:-4px}
.ed-food.on{border-style:solid;border-color:var(--gold);color:var(--gold)}
textarea.ed-name{min-height:52px;resize:none;line-height:1.3;padding:7px 10px;font-size:15px}
.ed-cost{display:flex;align-items:center;gap:6px;min-height:52px}
.ed-cost input{text-align:right;padding-inline:8px}
.ed-cost span{font:600 12px var(--font-display);color:var(--gold)}
.keep{width:44px;height:44px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;border-radius:2px}
.keep::after{content:"";width:16px;height:16px;border:2px solid var(--muted)}
.keep.on{border-color:var(--glow)}
.keep.on::after{border-color:var(--glow);background:var(--glow);box-shadow:0 0 10px var(--glow)}
.ed.off input{opacity:.45}
.ed-add{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px}
.ed-add select{grid-column:1}
.ed-add .btn{grid-column:2}
.rank-ed{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:center}

/* journal */
.tbl-wrap{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font:600 10px var(--font-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--faint);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.pos{color:var(--ok)}
.neg{color:var(--red-soft)}
.logs{display:grid;gap:8px}
.log{border:1px solid var(--faint);background:rgba(8,20,46,.55)}
.log summary{list-style:none;cursor:pointer;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.log summary::-webkit-details-marker{display:none}
.log summary b{font-family:var(--font-display)}
.log summary small{color:var(--muted);font-size:13px}
.log-r{text-align:right;font:600 13px var(--font-display);color:var(--muted);font-variant-numeric:tabular-nums}
.log-body{padding:0 12px 12px;display:grid;gap:6px;font-size:14px}
.log-body .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.log-body .ln span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.ach{display:grid;gap:8px}
.ach-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--faint)}
.ach-i b{font-family:var(--font-display)}
.ach-i small{color:var(--muted)}
.ach-i.off{opacity:.5}
.ach-i .tag{align-self:center}
.chart{width:100%;height:auto;display:block}
.top-btns{display:flex;gap:8px}
.icon-btn.on{background:rgba(60,140,255,.25)}
.q.na{opacity:.5}
.qin{cursor:default}
.q label.q-l{font:600 16px var(--font-body);text-transform:none;letter-spacing:0;color:var(--text)}
.q label.q-l small{font-size:12px;font-weight:400}
.q-in{display:flex;align-items:center;gap:6px}
.q-in input{width:64px;min-height:36px;padding:6px;text-align:center;font:600 16px var(--font-display)}
.malus{font:600 14px var(--font-display);color:var(--red-soft);border-left:2px solid var(--red);padding:4px 10px;background:rgba(255,64,88,.08)}
.plan{display:grid;gap:10px}
.plan .res-cell b{font-size:18px}
.kbar{height:12px;background:rgba(40,80,150,.35);border:1px solid rgba(90,170,255,.35);position:relative;overflow:hidden}
.kbar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2a7bff,#8fdcff)}
.kbar.ok i{background:linear-gradient(90deg,#2fbf8a,var(--ok))}
.kbar.over i{background:linear-gradient(90deg,#d9822b,var(--orange))}
.kbar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;opacity:.7}
.meal-list{list-style:none;margin:0;padding:0;display:grid}
.meal-it{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--faint)}
.meal-it .n{min-width:0}
.meal-it .n small{display:block;color:var(--muted);font-size:12px}
.meal-it .k{font:600 14px var(--font-display);font-variant-numeric:tabular-nums;text-align:right}
.meal-it.rw .k{color:var(--gold)}
.x{background:none;border:1px solid var(--faint);color:var(--muted);width:34px;height:34px;cursor:pointer;border-radius:2px}
.food-res{list-style:none;margin:0;padding:0;display:grid;max-height:46vh;overflow:auto;border:1px solid var(--faint)}
.food-res button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--faint);color:var(--text);padding:9px 10px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;font:500 14px var(--font-body)}
.food-res button:hover{background:rgba(60,140,255,.12)}
.food-res small{color:var(--muted);font-family:var(--font-display);white-space:nowrap}
.food-res .src{color:var(--gold);font-size:11px}
.seg.seg-wrap{display:flex;flex-wrap:wrap;align-self:stretch}
.seg.seg-wrap button{flex:1 1 auto}
.modal>.win>*{flex-shrink:0}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--faint)}
.reading{font:600 16px/1.4 var(--font-display);padding:10px 12px;border-left:3px solid var(--glow);background:rgba(60,140,255,.1)}
.reading.good{border-color:var(--ok);background:rgba(94,240,184,.08)}
.reading.warn{border-color:var(--orange);background:rgba(255,160,74,.08)}
.ph-up{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph-up .btn{padding:12px 6px;font-size:12px;text-align:center;display:grid;place-items:center}
.ph-list{display:grid;gap:12px}
.ph-row{display:grid;gap:8px;padding-top:10px;border-top:1px solid var(--faint)}
.ph-meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.ph-meta b{font-family:var(--font-display)}
.ph-meta span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.ph-meta .link{margin-left:auto;padding:0;min-height:0}
.ph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ph-grid figure,.ph-cmp figure{margin:0;display:grid;gap:4px;min-width:0}
.ph-grid img,.ph-cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid var(--faint);background:rgba(4,14,34,.85);display:block}
.ph-cmp img{object-fit:contain}
.ph-empty{display:grid;place-items:center;aspect-ratio:3/4;border:1px dashed var(--faint);color:var(--muted)}
figcaption{font:600 11px var(--font-display);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;text-align:center}
.empty{padding:14px;border:1px dashed rgba(120,190,255,.3);color:var(--muted);font-size:15px}

/* onboarding */
.ob{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}
.ob-big{font:600 21px/1.35 var(--font-display);letter-spacing:.01em}
.ob-steps{display:flex;gap:6px}
.ob-steps i{flex:1;height:3px;background:rgba(90,170,255,.25)}
.ob-steps i.on{background:var(--glow);box-shadow:0 0 8px var(--glow)}

/* nav, modal, fx, toasts */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(3,8,18,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
.nav button{background:none;border:0;color:var(--muted);font:600 11px var(--font-display);letter-spacing:.05em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;min-height:54px;cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--glow);text-shadow:0 0 10px rgba(120,200,255,.7)}
.modal{position:fixed;inset:0;z-index:30;background:rgba(1,4,10,.8);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{align-items:center}}
.modal>.win{width:100%;max-width:520px;max-height:86vh;max-height:86dvh;overflow:auto}
.feel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.feel button{min-height:58px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 11px/1.2 var(--font-display);letter-spacing:.04em;cursor:pointer;padding:6px 2px;border-radius:2px}
.feel button.on{background:rgba(60,140,255,.35);border-color:var(--glow);color:#fff}
.fx{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,rgba(40,120,255,.34),transparent 62%),rgba(2,6,14,.97);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.fx::before{content:"";position:absolute;left:-20%;right:-20%;top:50%;height:2px;background:linear-gradient(90deg,transparent,var(--glow),transparent);box-shadow:0 0 24px var(--glow);animation:beam 1.2s ease-out both}
.fx-card{position:relative;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;animation:fxIn .7s cubic-bezier(.2,.9,.2,1) both;max-width:440px}
.fx-eyebrow{font:600 13px var(--font-display);letter-spacing:.3em;text-transform:uppercase;color:var(--glow)}
.fx-big{font:700 clamp(46px,15vw,92px)/.95 var(--font-display);letter-spacing:.04em;color:#fff;text-shadow:0 0 30px rgba(100,180,255,.95),0 0 60px rgba(60,140,255,.6);text-transform:uppercase}
.fx-mid{font:700 clamp(24px,7vw,34px)/1.15 var(--font-display);color:#fff;text-shadow:0 0 22px rgba(100,180,255,.8)}
.fx-sub{font-size:17px;max-width:32ch}
.fx.rank{background:radial-gradient(circle at 50% 45%,rgba(245,201,90,.26),transparent 62%),rgba(2,6,14,.97)}
.fx.rank::before{background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 24px var(--gold)}
.fx.rank .fx-big,.fx.gold .fx-mid{color:var(--gold);text-shadow:0 0 30px rgba(245,201,90,.8)}
.fx.rank .fx-eyebrow,.fx.gold .fx-eyebrow{color:var(--gold)}
.fx.gold{background:radial-gradient(circle at 50% 45%,rgba(245,201,90,.22),transparent 62%),rgba(2,6,14,.97)}
@keyframes fxIn{from{opacity:0;transform:scale(.88);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
@keyframes beam{from{transform:scaleX(0);opacity:1}to{transform:scaleX(1);opacity:.35}}
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{max-width:440px;width:100%;background:rgba(5,16,38,.97);border:1px solid var(--glow);box-shadow:0 0 20px rgba(60,150,255,.4);padding:10px 14px;font:600 14px/1.35 var(--font-display);color:var(--text);animation:tIn .25s ease;transition:opacity .4s,transform .4s}
.toast.gold{border-color:var(--gold);box-shadow:0 0 20px rgba(245,201,90,.35)}
.toast.red{border-color:var(--red);box-shadow:0 0 20px rgba(255,64,88,.35)}
.toast.ok{border-color:var(--ok)}
.toast.out{opacity:0;transform:translateY(-6px)}
@keyframes tIn{from{opacity:0;transform:translateY(-8px)}}
.loading{min-height:80vh;display:grid;place-items:center}
.loading .win{max-width:360px;text-align:center;animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.stats2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:4px}
.stat2{border:1px solid var(--faint);padding:8px 2px 7px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.stat2 .stat-k{font:700 12px var(--font-display);color:var(--glow);letter-spacing:.1em}
.stat2 .stat-v{font:700 21px var(--font-display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat2 .stat-l{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.st-how{margin-top:2px}
.stat-gain{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font:700 16px var(--font-display);color:var(--ok);margin-top:4px}
.stat-gain b{color:var(--glow);margin-right:5px;letter-spacing:.08em}
.sleep-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.sleep-pick button{min-height:44px;border:1px solid var(--line);background:rgba(10,30,70,.45);color:var(--text);font:600 15px var(--font-display);font-variant-numeric:tabular-nums;cursor:pointer}
.sleep-pick button.on{background:rgba(60,140,255,.35);border-color:var(--glow);color:#fff}
.ring-row{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;align-items:center;margin:4px 0}
.ring{width:132px;height:132px;display:block}
.ring-bg{fill:none;stroke:rgba(40,80,150,.35);stroke-width:11}
.ring-fg{fill:none;stroke:var(--blue);stroke-width:11;stroke-linecap:round}
.ring.ok .ring-fg{stroke:var(--ok)}
.ring.over .ring-fg{stroke:var(--orange)}
.ring-n{font:700 27px var(--font-display);fill:var(--text)}
.ring-l{font:600 8.5px var(--font-display);letter-spacing:.06em;text-transform:uppercase;fill:var(--muted)}
.ring-side{display:grid;gap:12px;min-width:0}
.ring-side div{display:flex;flex-direction:column}
.ring-side b{font:700 24px var(--font-display);font-variant-numeric:tabular-nums}
.ring-side span{font:600 10px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.macs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mac-h{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
.mac-h span{font:600 10px var(--font-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mac-h b{font:600 13px var(--font-display);font-variant-numeric:tabular-nums}
.mac .kbar{height:8px}
.slot-rows{list-style:none;margin:2px 0 0;padding:0;display:grid;border-top:1px solid var(--faint)}

/* ----- dungeon run ----- */
function viewDungeon() {
  const d = S.draft, plan = planFor(d.cw, d.type), W = d.deload ? DELOAD : curPlan().weeks[d.week];
  let planned = 0, doneReq = 0;
  for (const it of plan) { const n = it.sets - (d.minus[it.ex] || 0); if (!it.opt) { planned += n; doneReq += (d.sets[it.ex] || []).slice(0, n).filter(r => r.done).length; } }
  const pct = planned ? Math.round(doneReq / planned * 100) : 0;
  return `<div class="dg-top"><button class="btn ghost sm" data-act="dgMenu">Pause</button><div class="dg-name">${sessLabel(d)} · ${tyLabel(d.type)}</div><div class="dg-clock" id="dgClock">00:00</div></div>
    <div class="xpbar" role="progressbar" aria-label="Séries faites" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <section class="win"><h2 class="win-title">${esc(TYPES[d.type].gate)}</h2>
      <p class="sys-line">[Vous êtes entré dans un donjon de rang ${W.rank}.] ${doneReq} / ${planned} séries</p>
      <button class="q ${d.warm ? "on" : ""}" data-act="warm" role="checkbox" aria-checked="${!!d.warm}"><span class="box" aria-hidden="true"></span><span class="q-l">Échauffement</span><span class="q-t">${d.warm ? "[Fait]" : "[À faire]"}</span></button>
      <p class="muted small">5 min de cardio léger, 2 séries de montée progressive sur le premier exercice, puis 1 série légère avant chaque nouveau mouvement.</p>
      ${d.deload ? `<p class="sugg">Semaine allégée : moitié des séries, mêmes charges, 3 reps en réserve. Tu dois sortir frais.</p>` : ""}
      ${d.bonus ? `<p class="sugg">Donjon bonus de grosse semaine.</p>` : ""}
      ${d.week === 8 && !d.deload && planTest()[d.type] ? `<p class="sugg test">Semaine du bilan : les exercices marqués « Épreuve » mesurent ta progression depuis S4.</p>` : ""}
      ${d.week === 1 && !d.deload ? `<p class="sugg">${curPlan().s1}</p>` : curPlan().id === "felix" && d.week <= 3 && !d.deload ? `<p class="sugg">${curPlan().s1}</p>` : ""}
    </section>
    ${plan.map((it, i) => exCard(it, i, d)).join("")}
    ${curPlan().finisher ? `<section class="win"><h2 class="win-title">Finisher</h2><button class="q ${d.fin ? "on" : ""}" data-act="fin" role="checkbox" aria-checked="${!!d.fin}"><span class="box" aria-hidden="true"></span><span class="q-l">10 min de marche inclinée</span><span class="q-t">${d.fin ? "[Fait]" : "+20 XP · +10 or"}</span></button><p class="muted small">Sur tapis, pente 8 à 12 %, à un rythme où tu peux encore parler. Ça brûle sans te fatiguer pour la séance suivante.</p></section>` : ""}
    <button class="btn primary wide big" data-act="finishAsk">Terminer le donjon</button>`;
}
function exCard(it, i, d) {
  const ex = EX[it.ex], n = it.sets - (d.minus[it.ex] || 0), rows = d.sets[it.ex] || [];
  const sg = suggest(it, {p: d.week, deload: !!d.deload});
  const done = rows.slice(0, n).filter(r => r.done).length, cleared = done >= n;
  const tags = [i === 0 ? `<span class="tag boss">Boss</span>` : "", it.test ? `<span class="tag test">Épreuve</span>` : "", `<span class="tag">${ex.kind === "poly" ? "Gros mouvement" : "Isolation"}</span>`, `<span class="tag">Repos ${RESTTXT[it.rest]}</span>`, it.opt ? `<span class="tag">Option</span>` : "", it.maint ? `<span class="tag">Entretien</span>` : "", it.superset ? `<span class="tag">Superset</span>` : ""].join("");
  const last = sg.last ? `<div class="hist"><span>Dernière fois</span>${sg.last.sets.map(s => `${fmt(s.kg)}×${s.reps}`).join(" · ")} <small class="muted">(S${sg.last.week})</small></div>` : "";
  const sugKg = sg.kind === "test" && sg.testKg != null ? sg.testKg : sg.kg;
  const sugg = sg.text ? `<div class="sugg ${sg.kind}">${sugKg != null ? `Le Système suggère <b>${fmt(sugKg)} kg</b>. ` : ""}${esc(sg.text)}</div>` : "";
  const ph = k => (it.test && k === 0) ? "max" : (sg.reps[k] != null ? sg.reps[k] : (it.reps[0] === it.reps[1] ? it.reps[0] : it.reps[0] + "-" + it.reps[1]));
  const setRows = rows.slice(0, n).map((r, k) => `<div class="set-row ${r.done ? "done" : ""}"><span class="sn">${k + 1}</span>
      <input id="kg-${it.ex}-${k}" data-bind="dg" data-f="kg" data-ex="${it.ex}" data-i="${k}" inputmode="decimal" autocomplete="off" value="${esc(r.kg)}" placeholder="kg" aria-label="Charge en kg, série ${k + 1}">
      <input id="rp-${it.ex}-${k}" data-bind="dg" data-f="reps" data-ex="${it.ex}" data-i="${k}" inputmode="numeric" autocomplete="off" value="${esc(r.reps)}" placeholder="${ph(k)}" aria-label="Reps, série ${k + 1}">
      <button class="chk" data-act="set" data-ex="${it.ex}" data-i="${k}" aria-label="Valider la série ${k + 1}" aria-pressed="${!!r.done}">${ICON.check}</button></div>`).join("");
  const m = d.minus[it.ex] || 0, lastRow = rows[n - 1];
  const minus = (n > 1 && !(lastRow && lastRow.done)) ? `<button class="link" data-act="minus" data-ex="${it.ex}">Encore courbaturé ? Retirer une série</button>` : "";
  const unminus = m > 0 ? `<button class="link" data-act="unminus" data-ex="${it.ex}">Remettre la série retirée</button>` : "";
  return `<article class="ex ${i === 0 ? "boss" : ""} ${cleared ? "cleared" : ""}" id="ex-${it.ex}">
    <div class="ex-h"><span class="ex-n">${pad(i + 1)}</span><div><h3>${esc(ex.n)}</h3><div class="tags">${tags}</div></div></div>
    <div class="target"><b>${n} × ${repsTxt(it)}</b> · ${it.rir.txt}</div>
    ${it.rir.fail ? `<div class="fail">Dernière série : jusqu'à l'échec</div>` : ""}
    <p class="cue">${esc(it.cue)}</p>${last}${sugg}
    <div class="sets"><div class="set-row head" aria-hidden="true"><span></span><span>${ex.eq === "bw" ? "Lest kg" : "kg"}</span><span>Reps</span><span></span></div>${setRows}</div>
    ${minus}${unminus}</article>`;
}

/* ----- results ----- */

  const chest = d.loot ? `<div class="chest"><button class="chest-btn ${r.opened ? "open" : ""}" data-act="openChest" style="--tc:${TC[d.loot.tier]}" aria-label="Ouvrir le coffre"><span class="chest-box"></span><span class="chest-lid"></span><span class="chest-lock"></span></button>
      ${r.opened ? `<p class="loot" style="--tc:${TC[d.loot.tier]}">Coffre ${d.loot.tier} : +${d.loot.gold} or</p>` : `<button class="btn gold" data-act="openChest">Ouvrir le coffre</button>`}</div>` : "";

  return `<section class="win"><h2 class="win-title">[Système]</h2><h1 class="res-title ${cls}">${title}</h1>
      <p class="sys-line" style="text-align:center">${sessLabel(d)} · ${sessName(d)}</p>
      <div class="res-grid"><div class="res-cell"><b>${d.doneReq}/${d.planned}</b><span>Séries</span></div><div class="res-cell"><b>${d.minutes}</b><span>Minutes</span></div><div class="res-cell"><b>${(d.prs || []).length}</b><span>Records</span></div></div>
      <div class="gain"><span class="x">+${d.xp} XP</span><span class="g">+${d.gold - (d.loot && !r.opened ? d.loot.gold : 0)} or${d.loot && !r.opened ? " + coffre" : ""}</span></div>
      ${(() => { const sd = ["FOR", "VIT", "AGI", "INT", "PER"].map(k => [k, r.after.stats[k] - r.before.stats[k]]).filter(x => x[1] > 0); return sd.length ? `<div class="stat-gain">${sd.map(([k, v]) => `<span><b>${k}</b>+${v}</span>`).join("")}</div>` : ""; })()}
      ${r.wb && r.wb.xp > 0 ? `<p class="done-line" style="text-align:center">[${r.wb.big ? "Grosse semaine" : r.wb.perfect ? "Semaine complète" : "Bonus de semaine"}] +${r.wb.xp} XP · +${r.wb.gold} or</p>` : ""}
      ${d.valid ? "" : `<p class="muted small" style="text-align:center">Moins de la moitié des séries : ce donjon ne compte pas pour la semaine.</p>`}
    </section>
    ${chest ? `<section class="win"><h2 class="win-title">Butin</h2>${chest}</section>` : ""}
    ${prs ? `<section class="win"><h2 class="win-title">Records battus</h2><ul class="pr-list">${prs}</ul></section>` : ""}
    ${newAch.length ? `<section class="win"><h2 class="win-title">Titres obtenus</h2><ul class="pr-list">${newAch.map(a => `<li><b>${esc(a.name)}</b><br>${esc(a.desc)} +${a.xp} XP, +${a.gold} or</li>`).join("")}</ul></section>` : ""}
    <section class="win"><h2 class="win-title">Progression</h2><p class="sys-line">Niveau ${r.before.level} → ${r.after.level} · rang ${r.after.rank}</p><div class="xpbar"><i style="width:${Math.min(100, Math.round(r.after.into / r.after.need * 100))}%"></i></div></section>
    <button class="btn primary wide big" data-act="leaveResults">Retour au statut</button>`;
}
function resultsFx() {
  const r = state.results; if (!r || r.fxDone) return; r.fxDone = true;
  if (r.after.level > r.before.level) pushFx({kind: "level", eyebrow: "[Level up]", big: "Niveau " + r.after.level, sub: `+${plural(r.after.level - r.before.level, "niveau", "niveaux")}. Le Système a enregistré ta progression.`});
  if (RANKS.indexOf(r.after.rank) > RANKS.indexOf(r.before.rank)) pushFx(rankFx(r.after.rank));
}

function viewShop(P) {
  const items = (S.rewards?.items || []);
  const locked = !!P.penalty;
  const row = it => { const can = !locked && P.gold >= it.cost; return `<li class="rw"><span class="rw-n">${esc(it.name)}${it.food ? ' <span class="tag">Repas</span>' : ""}${it.effect === "skip" ? ' <span class="tag test">Laissez-passer</span>' : ""}</span><span class="rw-c"><i class="coin"></i>${fmt(it.cost, 0)}</span><button class="btn sm ${can ? "gold" : "ghost"}" data-act="buy" data-id="${esc(it.id)}" ${can ? "" : "disabled"}>${locked ? "Verrouillé" : can ? "Échanger" : `Encore ${fmt(it.cost - P.gold, 0)}`}</button></li>`; };
  const tiers = TIERS.map(t => { const list = items.filter(i => i.tier === t.k).sort((a, b) => a.cost - b.cost); return list.length ? `<section class="win"><h2 class="win-title">${t.name}</h2><ul class="shop">${list.map(row).join("")}</ul></section>` : ""; }).join("");

function bodyReading() {

async function uploadPhoto(file, pose) {
  const date = state.phDate || today();

  state.photoBusy = pose; render();

    // Photos the browser can read are shrunk here; iPhone HEIC (or anything unreadable) goes raw and the PC converts it.
    const isHeic = /\.(heic|heif)$/i.test(file.name || "") || /hei[cf]/i.test(file.type || "");
    let blob = null;
    if (!isHeic) {
      try {
        const bmp = await createImageBitmap(file);
        const sc = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
        const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
        cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
        blob = await new Promise(r => cv.toBlob(r, "image/jpeg", 0.85));
      } catch (e) { blob = null; }
    }
    const name = `${date}_${pose}.jpg`;
    if (Store.mode === "cloud") {
      if (!blob) blob = await heicToJpeg(file);

    } else {
      const convert = !blob;
      const res = await fetch("api/photo?name=" + encodeURIComponent(name) + (convert ? "&convert=1" : ""), {method: "POST", headers: {"Content-Type": convert ? "application/octet-stream" : "image/jpeg"}, body: convert ? file : blob});
      if (!res.ok) { const j = await res.json().catch(() => ({})); throw new Error(j.error || "upload " + res.status); }
    }
    const doc = {...(S.photos[date] || {}), date, [pose]: name, ts: Date.now()}; delete doc.id;
    S.photos = {...S.photos, [date]: doc}; await queueSet("photos/" + date, doc);
    toast(`[Photo enregistrée] ${label}, ${fmtDay(fromStr(date), {day: "numeric", month: "long"})}`, "ok");
  } catch (e) { toast(e && e.message === "heic_unsupported" ? "[Système] Le module pour les photos iPhone n'est pas installé sur ce PC. Préviens Claude." : "[Système] Photo illisible : essaie une autre photo (JPEG, PNG ou iPhone).", "red"); }

  {tier: "moyenne", name: "Pâtes au saumon et emmental maison, bien chargées", cost: 500, food: true},
  {tier: "moyenne", name: "Un burger maison bien chargé avec des frites", cost: 600, food: true},

}
function seedPlan(force) {                    // once per load: remember the program, Félix's dishes, fixes from Gauthier's feedback
  if ((state.seeded && !force) || !S.profile) return; state.seeded = true;
  const p = S.profile, det = detectPlan(p.name, cloudName());
  let next = !PLANS[p.program] && det ? {...clone(p), program: det} : null;
  const prof = () => next || (next = clone(p)), mark = k => { prof().seeded = {...(prof().seeded || {}), [k]: true}; }, done = k => !!((next || p).seeded || {})[k];
  const pid = (next || p).program;
  const saveRewards = items => { S.rewards = {rank: {...RANK_DEFAULT}, ...(S.rewards || {}), items}; queueSet("game/rewards", S.rewards); };
  if (pid === "felix" && !done("felixDishes2")) {
    const OLD = {"Pâtes au saumon version resto, avec plein d'emmental": [0, 600], "Un burger bien chargé avec des frites": [1, 700]};   // first wording -> home dishes
    let items = (S.rewards?.items || []).map(i => OLD[i.name] ? {...i, name: FELIX_REWARDS[OLD[i.name][0]].name, cost: i.cost === OLD[i.name][1] ? FELIX_REWARDS[OLD[i.name][0]].cost : i.cost} : i);
    const have = new Set(items.map(i => i.name)), want = done("felixDishes") ? FELIX_REWARDS.slice(0, 1) : FELIX_REWARDS;   // the pasta stays a reward no matter what
    items = [...items, ...want.filter(r => !have.has(r.name)).map((r, i) => ({...r, id: "fx" + i + "b"}))];
    saveRewards(items); mark("felixDishes"); mark("felixDishes2");
  }
  if (!done("fbFix1")) {                       // 22 Oct full body as really done: leg extension (typed in the leg-press rows), no RDL; Félix used the chest press
    for (const ses of S.sessions.filter(x => x.type === "FB")) {
      const sets = {...(ses.sets || {})}; let changed = false;
      if (sets.rdl) { delete sets.rdl; changed = true; }
      if (sets.legPress && !sets.legExt) { sets.legExt = sets.legPress; delete sets.legPress; changed = true; }
      if (pid === "felix" && sets.bench && !sets.machPress) { sets.machPress = sets.bench; delete sets.bench; changed = true; }
      if (changed) { const doc = {...ses, sets}; delete doc.id; S.sessions = S.sessions.map(x => x.id === ses.id ? {id: ses.id, ...doc} : x); queueSet("sessions/" + ses.id, doc); }
    }
    mark("fbFix1");
  }
  if (pid === "base" && !done("shop2")) {     // "il n'y a quasiment rien" (26 Oct): fill his shop with what he likes
    const items = (S.rewards?.items || []).slice(), have = new Set(items.map(i => normPseudo(i.name)));
    saveRewards([...items, ...GAUTHIER_SHOP.filter(r => !have.has(normPseudo(r.name))).map((r, i) => ({...r, id: "g" + i}))]); mark("shop2");
  }
  if (pid === "base" && !done("sick1026")) {  // sick on Mon 26 Oct: that day paused, week moved to Tue A / Wed B / Fri C / Sat Haut (his usual rhythm, one day later)
    const cw = weekOfStr("2026-10-26"), t = today();
    const wi = weekInfo(cw);
    if (t >= "2026-10-26" && t <= "2026-10-27" && wi && !wi.deload && wi.types.length === 4 && wi.types[0] === "A" && !S.sessions.some(x => sessionCw(x) === cw)) {
      const side = weekInfo(cw).types[3];
      prof().moves = {...(prof().moves || {}), [cw]: {A: "2026-10-27", B: "2026-10-28", C: "2026-10-30", [side]: "2026-10-31"}};
      const d = {...(S.days["2026-10-26"] || {}), date: "2026-10-26", sick: true}; delete d.id; S.days = {...S.days, "2026-10-26": d}; queueSet("days/2026-10-26", d);
    }

}

document.addEventListener("click", e => {

/* ================= timers ================= */
function tick() {
  const now = Date.now();
  const qt = document.getElementById("qTimer");
  if (qt) { const d = new Date(), mid = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); const s = Math.max(0, Math.floor((mid - d) / 1000)); qt.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; }
  const fs = document.getElementById("fastStatus");
  if (fs && S.profile) { const fp = fastPlan(S.profile); if (fp) { const st = fastStatus(fp, new Date()); if (fs.textContent !== st.txt) { fs.textContent = st.txt; fs.classList.toggle("good", st.open); } } }
  const dc = document.getElementById("dgClock");
  if (dc && S.draft && S.draft.startedAt) { const s = Math.max(0, Math.floor((now - Date.parse(S.draft.startedAt)) / 1000)); dc.textContent = (s >= 3600 ? Math.floor(s / 3600) + ":" : "") + pad(Math.floor(s % 3600 / 60)) + ":" + pad(s % 60); }
  const rb = document.getElementById("restbar");

    if (left <= 0) {

      rb.classList.add("done"); document.getElementById("rbTime").textContent = "C'est reparti"; document.getElementById("rbLabel").textContent = "Repos terminé"; document.getElementById("rbFill").style.width = "100%";
      if (left < -10000) { state.rest = null; rb.hidden = true; }
    } else {
      const s = Math.ceil(left / 1000); rb.classList.remove("done");
      document.getElementById("rbTime").textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`; document.getElementById("rbLabel").textContent = "Repos";
      document.getElementById("rbFill").style.width = Math.min(100, (1 - left / state.rest.total) * 100) + "%";
    }
  } else rb.hidden = true;
  const t = today();
  if (state.lastDay && state.lastDay !== t && state.ready && state.view !== "dungeon") { state.lastDay = t; render(); return; }
  state.lastDay = t;
}
setInterval(tick, 250);

/* ================= boot ================= */
function subscribe() {
  const db = Store.db;

  const mark = k => { loaded.add(k); if (!state.ready && ["profile", "rewards", "sessions", "days", "purchases", "penalties", "photos", "meals", "foods", "mealtpl", "draft"].every(x => loaded.has(x))) state.ready = true; scheduleRender(); };
  const docsOf = q => q.docs.filter(d => d.exists).map(d => ({id: d.id, ...(d.data() || {})}));
  db.doc("game/profile").onSnapshot(s => { S.profile = s.exists ? s.data() : null; mark("profile"); }, lost);
  db.doc("game/rewards").onSnapshot(s => { S.rewards = s.exists ? s.data() : null; mark("rewards"); }, lost);
  db.collection("sessions").onSnapshot(q => { S.sessions = docsOf(q); mark("sessions"); }, lost);
  db.collection("days").onSnapshot(q => { const m = {}; for (const d of docsOf(q)) m[d.id] = d; S.days = m; mark("days"); }, lost);
  db.collection("purchases").onSnapshot(q => { S.purchases = docsOf(q); mark("purchases"); }, lost);
  db.collection("penalties").onSnapshot(q => { const m = {}; for (const d of docsOf(q)) m[d.id] = d; S.penalties = m; mark("penalties"); }, lost);
  db.collection("photos").onSnapshot(q => { const m = {}; for (const d of docsOf(q)) m[d.id] = d; S.photos = m; mark("photos"); }, lost);
  db.collection("meals").onSnapshot(q => { const m = {}; for (const d of docsOf(q)) m[d.id] = d; S.meals = m; mark("meals"); }, lost);
  db.doc("game/foods").onSnapshot(s => { S.foods = s.exists ? s.data() : null; mark("foods"); }, lost);
  db.doc("game/mealtpl").onSnapshot(s => { S.mealtpl = s.exists ? s.data() : null; mark("mealtpl"); }, lost);
  db.doc("game/draft").get().then(s => { const d = s.exists ? s.data() : null; S.draft = d && d.active ? clone(d) : null; if (S.draft) { S.draft.minus = S.draft.minus || {}; S.draft.sets = S.draft.sets || {}; if (S.draft.cw == null) S.draft.cw = S.draft.week; } mark("draft"); })
    .catch(() => { S.draft = null; mark("draft"); });
}
async function boot() {
